name: Bump Version and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to increment"
        required: false
        default: "minor"
        type: choice
        options:
          - minor
          - major
          - patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Sync version to Tauri files
        run: npx tsx scripts/sync-version.ts

      - name: Read version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "release: bump version to ${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin main --follow-tags
