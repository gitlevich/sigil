[project]
name = "sigil-llm"
version = "0.1.0"
description = "Local inference sidecar for Sigil (@LeftHemisphere)"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python>=0.3.2",
    "huggingface-hub>=0.26",
    "uvicorn>=0.30",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "starlette-context>=0.3",
    "pydantic-settings>=2.5",
]

[project.scripts]
sigil-llm = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]
