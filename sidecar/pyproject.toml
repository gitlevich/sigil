[project]
name = "sigil-llm"
version = "0.1.0"
description = "Local inference sidecar for Sigil (@LeftHemisphere)"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.19",
]

[project.scripts]
sigil-llm = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]
